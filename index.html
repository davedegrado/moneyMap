<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8fafc" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>Le mie spese</title>
<style>
  body{margin:0;background:#f8fafc;-webkit-tap-highlight-color:transparent;
       font:14px/1.5 system-ui,-apple-system,sans-serif;color:#0f172a}
  #root{padding-bottom:env(safe-area-inset-bottom)}
  #boot{margin:24px;color:#64748b;font-size:13px}
  .err{margin:16px;padding:14px;border-radius:12px;background:#fef2f2;
       color:#7f1d1d;border:1px solid #fecaca;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div id="root"><p id="boot">Carico l'app…</p></div>
<script>
(function () {
  function mostra(msg) {
    var r = document.getElementById("root");
    if (!r || r.getAttribute("data-err")) return;
    r.setAttribute("data-err", "1");
    var d = document.createElement("div");
    d.className = "err";
    d.textContent = msg;
    r.innerHTML = "";
    r.appendChild(d);
  }
  window.addEventListener("error", function (e) {
    mostra("L'app non e' partita: " + (e.message || "errore") + (e.lineno ? " (riga " + e.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    mostra("Errore non gestito: " + ((r && (r.message || r)) || "?"));
  });

  // contrassegno sempre diverso: la cache non puo' restituire una copia vecchia
  var s = document.createElement("script");
  s.src = "app.js?v=" + Date.now();
  s.onerror = function () {
    mostra("Non riesco a scaricare app.js. Controlla di averlo caricato accanto a index.html e di essere connesso.");
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
