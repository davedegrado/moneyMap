<script>
(function () {
  function show(msg) {
    var r = document.getElementById("root");
    if (!r || r.getAttribute("data-err")) return;
    r.setAttribute("data-err", "1");
    var d = document.createElement("div");
    d.setAttribute("style", "font:13px/1.6 system-ui,sans-serif;margin:16px;padding:14px;border-radius:12px;background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca");
    d.textContent = "L'app non e' partita: " + msg;
    r.appendChild(d);
  }
  window.addEventListener("error", function (e) {
    show((e.message || "errore") + (e.lineno ? " (riga " + e.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    show("promise non gestita: " + ((r && (r.message || r)) || "?"));
  });
})();
